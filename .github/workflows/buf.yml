name: buf

on:
  push:
    branches: [main]
  pull_request:

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint
        run: buf lint

      # PR checkouts have no local 'main' ref, hence origin/main. Skip while
      # main has no .proto files yet (buf hard-fails on an empty module).
      - name: Breaking (against main)
        if: github.event_name == 'pull_request'
        run: |
          if git ls-tree -r origin/main --name-only | grep -q '\.proto$'; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo "main has no .proto files yet; skipping breaking check"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build generated code
        run: go build ./... && go vet ./...
